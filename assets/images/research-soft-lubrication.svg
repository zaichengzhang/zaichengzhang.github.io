<path d="M426 248 C450 248 469 272 491 262 C506 255 510 250 516 244 C530 226 539 231 554 240 C571 249 591 248 606 248 V286 H426Z" fill="url(#gelFront)"/>
<path d="M426 248 C450 248 469 272 491 262 C506 255 510 250 516 244 C530 226 539 231 554 240 C571 249 591 248 606 248" class="edge"/>
<path d="M426 248 H606" class="guide"/>
