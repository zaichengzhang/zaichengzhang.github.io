<svg xmlns="http://www.w3.org/2000/svg" width="520" height="292" viewBox="0 0 520 292" role="img" aria-labelledby="title desc">
<title id="title">Sliding and lift near a soft interface</title>
<desc id="desc">Conceptual cross-section: a sphere translates to the right above a deformable substrate and experiences an upward lift. The interface deformation is asymmetric. The shape is illustrative, not a computed solution.</desc>
<defs>
  <linearGradient id="liquid" x2="0" y2="1"><stop stop-color="#edf1ee"/><stop offset="1" stop-color="#e4ece8"/></linearGradient>
  <linearGradient id="gel" x2="0" y2="1"><stop stop-color="#96b3ad"/><stop offset="1" stop-color="#bfd0c6"/></linearGradient>
  <radialGradient id="particle" cx=".32" cy=".25" r=".8"><stop stop-color="#dfc2ac"/><stop offset=".65" stop-color="#bf8968"/><stop offset="1" stop-color="#a76c4f"/></radialGradient>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="#365c64" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="copper-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="#9d5e40" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M-2 10 10-2M8 12 12 8" stroke="#acbab4" stroke-width="1"/></pattern>
</defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;font-size:17px;fill:#36535a} .line{fill:none;stroke:#365c64;stroke-width:2;stroke-linecap:round;stroke-linejoin:round} .leader{fill:none;stroke:#748e8f;stroke-width:1.2} .motion{fill:none;stroke:#9d5e40;stroke-width:2;stroke-linecap:round;marker-end:url(#copper-arrow)} .label{font-size:15px}</style>
<rect width="520" height="292" fill="url(#liquid)"/>

<path d="M30 209 C105 209 142 208 178 199 C211 188 238 193 269 211 C307 231 344 216 389 210 C428 207 465 209 490 209 L490 292 H30Z" fill="url(#gel)"/>
<path d="M30 209 C105 209 142 208 178 199 C211 188 238 193 269 211 C307 231 344 216 389 210 C428 207 465 209 490 209" class="line"/>
<circle cx="245" cy="126" r="47" fill="url(#particle)" stroke="#99664e" stroke-width="1.4"/>
<path d="M216 103 A34 34 0 0 1 246 92" fill="none" stroke="#eee0d1" stroke-width="2" opacity=".7"/>
<path d="M306 126 H390" class="motion"/><text x="317" y="108">Sliding</text>
<path d="M245 72 V32" class="line" marker-end="url(#arrow)"/><text x="263" y="51">Lift</text>
<text x="37" y="77">Viscous liquid</text>
<path d="M245 180 V197 M240 180 H250 M240 197 H250" class="leader"/>
<text x="262" y="190" class="label">gap</text>
<text x="48" y="258">Deformable interface</text>

</svg>
