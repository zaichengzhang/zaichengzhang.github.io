roke-width="1"/><path d="M550 228 l34.5 -46 v12 l-34.5 46Z" fill="#bdcdc4" stroke="#91a9a1" stroke-width="1"/><path d="M342 158 l30 -42 h205 l-30 42Z" fill="url(#gelTop)" class="edge"/><path d="M342 158 h205 v66 h-205Z" fill="url(#gelFront)" class="edge"/><path d="M547 158 l30 -42 v66 l-30 42Z" fill="#aec6b8" class="edge"/><path d="M342 224 H547" stroke="#6e8d80" stroke-width="2.5"/><path d="M282 65 V269" stroke="#d3dfd6" stroke-width="1"/><text x="150" y="275" class="" text-anchor="middle">Transient creases</text><text x="460" y="275" class="" text-anchor="middle">Smooth surface</text><text x="320" y="323" class="small" text-anchor="middle">Swelling on a bonded substrate</text><text x="320" y="351" class="small" text-anchor="middle">Surface response depends on solvent conditions</text>
</svg>
