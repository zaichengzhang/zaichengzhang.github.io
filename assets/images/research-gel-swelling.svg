<svg xmlns="http://www.w3.org/2000/svg" width="640" height="380" viewBox="0 0 640 380" role="img" aria-labelledby="title desc">
<title id="title">Solvent-dependent swelling and creasing</title>
<desc id="desc">Two equally constrained PDMS gel layers on rigid substrates illustrate different solvent conditions. Shorter polymeric solvents can produce transient self-contacting surface creases, whereas longer polymeric solvents can leave the swollen surface smooth under the studied conditions. The narrow fold has touching flanks. The chain icons and equal schematic layer heights are qualitative; they do not specify chemistry or identical swelling ratios.</desc>
<defs>
<linearGradient id="gelTop" x1="0" y1="0" x2=".7" y2="1"><stop stop-color="#d8e5df"/><stop offset="1" stop-color="#abc5ba"/></linearGradient>
<linearGradient id="gelFront" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#a6c0b4"/><stop offset="1" stop-color="#c8d8ce"/></linearGradient>
<linearGradient id="glass" x2="0" y2="1"><stop stop-color="#e1e8e4" stop-opacity=".5"/><stop offset="1" stop-color="#becfc9" stop-opacity=".6"/></linearGradient>
<radialGradient id="bead" cx=".3" cy=".23" r=".78"><stop stop-color="#f2e9de"/><stop offset=".45" stop-color="#d5b69b"/><stop offset=".83" stop-color="#ad7f5d"/><stop offset="1" stop-color="#805b44"/></radialGradient>
<radialGradient id="oil" cx=".35" cy=".25" r=".75"><stop stop-color="#fff" stop-opacity=".9"/><stop offset=".5" stop-color="#d7e7e2" stop-opacity=".5"/><stop offset=".82" stop-color="#80aaa5" stop-opacity=".65"/><stop offset="1" stop-color="#d7e5de" stop-opacity=".8"/></radialGradient>
<linearGradient id="metal" x2="0" y2="1"><stop stop-color="#a2b1ad"/><stop offset=".45" stop-color="#78918e"/><stop offset="1" stop-color="#506b69"/></linearGradient>
<radialGradient id="halo"><stop stop-color="#d8e4df" stop-opacity=".35"/><stop offset="1" stop-color="#d8e4df" stop-opacity="0"/></radialGradient>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="#355c61" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="copperArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="#9b6548" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M-2 8 8-2 M6 10 10 6" stroke="#9aafa7" stroke-width=".7"/></pattern>
</defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;fill:#344f51;font-size:20px} .small{font-size:16px;fill:#566d6a} .math{font:italic 23px Georgia,'Times New Roman',serif} .edge{stroke:#527570;stroke-width:1.35;stroke-linecap:round;stroke-linejoin:round} path.edge:not([fill]){fill:none} .guide{fill:none;stroke:#92aaa1;stroke-width:1;stroke-dasharray:4 5} .leader{fill:none;stroke:#859c95;stroke-width:1.1;stroke-linecap:round} .arrow{fill:none;stroke:#355c61;stroke-width:1.7;stroke-linecap:round;marker-end:url(#arrow)} .drive{fill:none;stroke:#9b6548;stroke-width:1.8;stroke-linecap:round;marker-end:url(#copperArrow)} .dim{fill:none;stroke:#587771;stroke-width:1.15;stroke-linecap:round}</style>
<rect width="640" height="380" fill="#f0f3ee"/>
<ellipse cx="304" cy="195" rx="275" ry="170" fill="url(#halo)"/>
